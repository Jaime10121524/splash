name: SPLASH - APK Android com Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'frontend/scripts/android/MainActivity.java'
      - 'frontend/src/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/index.html'

permissions:
  contents: read

concurrency:
  group: splash-android-debug
  cancel-in-progress: false

jobs:
  apk:
    name: Compilar APK Android com Push FCM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android SDK na nuvem
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Instalar API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Instalar dependencias do frontend
        run: npm ci --no-audit --no-fund

      - name: Instalar TypeScript exigido pela configuracao Capacitor
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund typescript@5.9.3
          node -e "const ts=require('typescript'); if (!ts.transpileModule) process.exit(1); console.log('TypeScript',ts.version,'disponivel')"

      - name: Validar Firebase configurado
        env:
          FIREBASE_JSON_B64: ${{ secrets.SPLASH_FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          if [ -z "$FIREBASE_JSON_B64" ]; then
            echo "::error::Falta o segredo SPLASH_FIREBASE_GOOGLE_SERVICES_B64 em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configurar API HTTPS e gerar projeto Android
        run: |
          printf '%s\n' 'VITE_SPLASH_API_ORIGIN=https://splash.ahritech.com.br' > .env.capacitor.local
          npm run build -- --mode capacitor
          npx cap add android

      - name: Permitir cookies de sessao na WebView Android
        run: |
          target="android/app/src/main/java/br/com/ahritech/splash/MainActivity.java"
          test -f "$target"
          test -f "scripts/android/MainActivity.java"
          cp scripts/android/MainActivity.java "$target"

      - name: Configurar google-services.json do Firebase
        env:
          FIREBASE_JSON_B64: ${{ secrets.SPLASH_FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > android/app/google-services.json
          node <<'NODE'
          const fs = require('node:fs');
          const file = JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          const match = (file.client || []).some(c =>
            c.client_info?.android_client_info?.package_name === 'br.com.ahritech.splash'
          );
          if (!match) {
            console.error('Firebase nao possui o Android app br.com.ahritech.splash.');
            process.exit(1);
          }
          console.log('Firebase configurado para br.com.ahritech.splash.');
          NODE

      - name: Sincronizar Capacitor Android com Push
        run: npm run android:prepare

      - name: Compilar APK de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verificar APK gerado
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: SPLASH-Android-Firebase-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
