name: SPLASH – verificações

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: PHP syntax and financial smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find backend/app -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: CSRF regeneration after logout
        run: php backend/tests/session_csrf_smoke.php
      - name: Lock completed sales and validate protected test reset
        run: php backend/tests/protecao_venda_fechada_smoke.php
      - name: Financial calculation smoke test
        run: php backend/tests/venda_money_smoke.php
      - name: Commission distribution smoke test
        run: php backend/tests/rateio_rules_smoke.php
      - name: Automatic commission split tests
        run: php backend/tests/rateio_automatico_smoke.php
      - name: Annual rounding and upfront bonus commission tests
        run: php backend/tests/comissao_padrao_splash_smoke.php
      - name: Individual financial ledger tests
        run: php backend/tests/financeiro_saldos_smoke.php
      - name: Weekly multi-method settlement and plan rules tests
        run: php backend/tests/fechamento_lote_smoke.php
      - name: Personal finance, loan and settlement offset tests
        run: php backend/tests/financeiro_emprestimos_smoke.php
      - name: Independent broker closing isolation
        run: php backend/tests/fechamentos_escopo_smoke.php
      - name: Closing cash vs commission double-count regression
        run: php backend/tests/fechamento_conferencia_smoke.php
      - name: Audit person-by-person commission distribution
        run: php backend/tests/auditoria_rateios_smoke.php
      - name: Financial ledger permission and role isolation
        run: php backend/tests/extrato_permissoes_smoke.php
      - name: Central custody and reconciliation tests
        run: php backend/tests/conciliacao_custodia_smoke.php
      - name: Pix matching and reversal tests
        run: php backend/tests/pix_conciliacao_smoke.php

  frontend:
    name: React/Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
