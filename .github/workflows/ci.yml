name: SPLASH – verificações

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: PHP syntax and financial smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find backend/app -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Financial calculation smoke test
        run: php backend/tests/venda_money_smoke.php
      - name: Commission distribution smoke test
        run: php backend/tests/rateio_rules_smoke.php
      - name: Automatic commission split tests
        run: php backend/tests/rateio_automatico_smoke.php
      - name: Individual financial ledger tests
        run: php backend/tests/financeiro_saldos_smoke.php

  frontend:
    name: React/Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
